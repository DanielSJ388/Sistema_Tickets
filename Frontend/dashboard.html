<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SistemaTickets</title>
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <!-- El sidebar se insertará aquí automáticamente -->

        <!-- Contenido Principal -->
        <main class="main-content">
            <div class="main-header">
                <h2>Dashboard</h2>
                <p>Resumen general de tu actividad</p>
            </div>

            <!-- Estadísticas -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(0, 123, 255, 0.1); color: #007bff;">
                        <i class="fas fa-ticket-alt"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="total-tickets">0</div>
                        <div class="stat-label">Total Tickets</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(255, 193, 7, 0.1); color: #ffc107;">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="pendientes">0</div>
                        <div class="stat-label">Pendientes</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(40, 167, 69, 0.1); color: #28a745;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="resueltos">0</div>
                        <div class="stat-label">Resueltos</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(220, 53, 69, 0.1); color: #dc3545;">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="alta-prioridad">0</div>
                        <div class="stat-label">Alta Prioridad</div>
                    </div>
                </div>
            </div>

            <!-- Grid Principal -->
            <div class="dashboard-grid">
                <!-- Lista de Tickets Recientes -->
                <div class="card">
                    <h3>
                        <i class="fas fa-list"></i>
                        Tickets Recientes
                    </h3>
                    
                    <div id="listaTickets">
                        
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para ver detalles del ticket -->
    <div id="ticketModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>
                    <i class="fas fa-ticket-alt"></i>
                    Ticket <span id="modalTicketId">#000</span>
                </h2>
                <span class="close" onclick="cerrarModal()">&times;</span>
            </div>
            
            <div class="modal-body">
                <div class="ticket-detail-grid">
                    <div class="detail-section">
                        <h4>Información General</h4>
                        <div class="detail-item">
                            <label>Título:</label>
                            <span id="modalTitulo">-</span>
                        </div>
                        <div class="detail-item">
                            <label>Estado:</label>
                            <span id="modalEstado">-</span>
                        </div>
                        <div class="detail-item">
                            <label>Prioridad:</label>
                            <span id="modalPrioridad">-</span>
                        </div>
                        <div class="detail-item">
                            <label>Categoría:</label>
                            <span id="modalCategoria">-</span>
                        </div>
                        <div class="detail-item">
                            <label>Creado por:</label>
                            <span id="modalUsuario">-</span>
                        </div>
                        <div class="detail-item">
                            <label>Fecha:</label>
                            <span id="modalFecha">-</span>
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <h4>Descripción</h4>
                        <div class="descripcion-content">
                            <p id="modalDescripcion">-</p>
                        </div>
                        
                        <div id="modalArchivo" class="archivo-section">
                            <!-- Información del archivo se insertará aquí -->
                        </div>

                        <div id="modalAtender" class="atender-section" style="margin-top: 20px;">
                            <button class="btn btn-primary" id="btnAtender" onclick="atenderTicket()">
                                <i class="fas fa-headset"></i>
                                Atender Ticket
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="cerrarModal()">
                    <i class="fas fa-times"></i>
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal para atender ticket -->
    <div id="atenderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" style="background: #28a745;">
                <h2>
                    <i class="fas fa-headset"></i>
                    Atender Ticket <span id="ticketIdAtender">#000</span>
                </h2>
                <span class="close" onclick="cerrarModalAtender()">&times;</span>
            </div>
            
            <div class="modal-body">
                <div class="atender-info">
                    <h4 id="tituloTicketAtender">Título del ticket</h4>
                </div>
                
                <div class="atender-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="usuarioSelect">Asignar a Usuario:</label>
                            <select id="usuarioSelect" class="form-control">
                                <option value="">Sin asignar</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="prioridadSelect">Prioridad:</label>
                            <select id="prioridadSelect" class="form-control">
                                <option value="Low">Baja</option>
                                <option value="Medium">Media</option>
                                <option value="High">Alta</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="estadoSelect">Estado:</label>
                            <select id="estadoSelect" class="form-control">
                                <option value="Open">Abierto</option>
                                <option value="In Progress">En Progreso</option>
                                <option value="Closed">Cerrado</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="comentarioTicket">Comentario de Atención:</label>
                        <textarea id="comentarioTicket" class="form-control" rows="4" 
                                  placeholder="Describe las acciones tomadas para resolver el ticket..."></textarea>
                        <small class="form-text text-muted">Este comentario se guardará en el historial del ticket</small>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="cerrarModalAtender()">
                    <i class="fas fa-times"></i>
                    Cancelar
                </button>
                <button class="btn btn-success" onclick="guardarCambiosTicket()">
                    <i class="fas fa-save"></i>
                    Guardar Cambios
                </button>
            </div>
        </div>
    </div>

    <!-- Cargar el componente sidebar primero -->
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/sidebar-component.js"></script>
    <script src="assets/js/dashboard.js"></script>
    
    <script>
        // La inicialización ahora se maneja automáticamente en dashboard.js
    </script>
</body>
</html>
