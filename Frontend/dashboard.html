<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SistemaTickets</title>
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <!-- El sidebar se insertará aquí automáticamente -->

        <!-- Contenido Principal -->
        <main class="main-content">
            <div class="main-header">
                <h2>Dashboard</h2>
                <p>Resumen general de tu actividad</p>
            </div>

            <!-- Estadísticas -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(0, 123, 255, 0.1); color: #007bff;">
                        <i class="fas fa-ticket-alt"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="total-tickets">0</div>
                        <div class="stat-label">Total Tickets</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(255, 193, 7, 0.1); color: #ffc107;">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="pendientes">0</div>
                        <div class="stat-label">Pendientes</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(40, 167, 69, 0.1); color: #28a745;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="resueltos">0</div>
                        <div class="stat-label">Resueltos</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(220, 53, 69, 0.1); color: #dc3545;">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div>
                        <div class="stat-number" id="alta-prioridad">0</div>
                        <div class="stat-label">Alta Prioridad</div>
                    </div>
                </div>
            </div>

            <!-- Grid Principal -->
            <div class="dashboard-grid">
                <!-- Formulario para Crear Ticket -->
                <div class="card">
                    <h3>
                        <i class="fas fa-plus-circle"></i>
                        Crear Nuevo Ticket
                    </h3>
                    
                    <form id="ticketForm">
                        <div class="form-group">
                            <label for="titulo">Título del Ticket:</label>
                            <input type="text" id="titulo" name="titulo" placeholder="Describe brevemente el problema" required>
                        </div>

                        <div class="dashboard-grid-inner">
                            <div class="form-group">
                                <label for="categoria">Categoría:</label>
                                <select id="categoria" name="categoria" required>
                                    <option value="">Selecciona categoría</option>
                                    <option value="tecnico">Problema Técnico</option>
                                    <option value="consulta">Consulta General</option>
                                    <option value="solicitud">Solicitud de Servicio</option>
                                    <option value="reporte">Reporte de Error</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="descripcion">Descripción Detallada:</label>
                            <textarea id="descripcion" name="descripcion" rows="4" placeholder="Proporciona todos los detalles relevantes del problema..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Archivo Adjunto (Opcional):</label>
                            <div class="file-input-wrapper">
                                <input type="file" id="archivo" name="archivo" class="file-input" accept=".jpg,.jpeg,.png,.pdf,.txt,.docx">
                                <label for="archivo" class="file-input-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>Seleccionar archivo</span>
                                </label>
                                <span class="file-name" id="file-name"></span>
                            </div>
                        </div>

                        <button type="submit" class="btn">
                            <i class="fas fa-paper-plane"></i>
                            Crear Ticket
                        </button>
                    </form>
                </div>

                <!-- Lista de Tickets Recientes -->
                <div class="card">
                    <h3>
                        <i class="fas fa-list"></i>
                        Tickets Recientes
                    </h3>
                    
                    <div id="listaTickets">
                        
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Cargar el componente sidebar primero -->
    <script src="assets/js/sidebar-component.js"></script>
    <script src="assets/js/dashboard.js"></script>
    
    <script>
        // Inicializar el sidebar al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            window.sidebarInstance = initSidebar('dashboard');
        });
    </script>
</body>
</html>
