<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Ticket</title>
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <!-- El sidebar se insertará aquí automáticamente -->
        <!-- Contenido Principal -->
        <main class="main-content">
            <div class="main-header">
                <h2>Enviar Ticket</h2>
                <p>Rellena el formulario para enviar un nuevo ticket</p>
            </div>

            <!-- Formulario para Crear Ticket -->
                <div class="card">
                    <h3>
                        <i class="fas fa-plus-circle"></i>
                        Crear Nuevo Ticket
                    </h3>
                    
                    <form id="ticketForm">
                        <div class="form-group">
                            <label for="titulo">Título del Ticket:</label>
                            <input type="text" id="titulo" name="titulo" placeholder="Describe brevemente el problema" required>
                        </div>

                        <div class="dashboard-grid-inner">
                            <div class="form-group">
                                <label for="categoria">Categoría:</label>
                                <select id="categoria" name="categoria" required>
                                    <option value="">Selecciona categoría</option>
                                    <option value="tecnico">Problema Técnico</option>
                                    <option value="consulta">Consulta General</option>
                                    <option value="solicitud">Solicitud de Servicio</option>
                                    <option value="reporte">Reporte de Error</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="descripcion">Descripción Detallada:</label>
                            <textarea id="descripcion" name="descripcion" rows="4" placeholder="Proporciona todos los detalles relevantes del problema..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Archivo Adjunto (Opcional):</label>
                            <div class="file-input-wrapper">
                                <input type="file" id="archivo" name="archivo" class="file-input" accept=".jpg,.jpeg,.png,.pdf,.txt,.docx">
                                <label for="archivo" class="file-input-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>Seleccionar archivo</span>
                                </label>
                                <span class="file-name" id="file-name"></span>
                            </div>
                        </div>

                        <button type="submit" class="btn">
                            <i class="fas fa-paper-plane"></i>
                            Crear Ticket
                        </button>
                    </form>
                </div>
        </main>
    </div>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/sidebar-component.js"></script>
    <script src="assets/js/send-ticket.js"></script>
</body>
</html>
