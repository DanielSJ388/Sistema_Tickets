<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticación - SistemaTickets</title>
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="logo">
      <h1>🎫 SistemaTickets</h1>
      <p>Gestión de tickets simplificada</p>
    </div>

    <!-- Formulario de Registro -->
    <div id="registro-form" class="fade-in">
      <div class="form-header">
        <h2>Crear Cuenta</h2>
        <p>Únete y comienza a gestionar tus tickets</p>
      </div>
      
      <div class="input-group">
        <input type="text" id="reg-username" placeholder="👤 Nombre de usuario" required>
      </div>
      
      <div class="input-group">
        <input type="email" id="reg-email" placeholder="📧 Correo electrónico" required>
      </div>
      
      <div class="input-group">
        <input type="password" id="reg-password" placeholder="🔒 Contraseña" required>
      </div>
      
      <!-- Campo oculto para código de SuperUser -->
      <div id="superuser-field" class="input-group superuser-field" style="display: none;">
        <input 
          type="password" 
          id="reg-superuser-code" 
          placeholder="🛡️ Código de SuperUser"
          autocomplete="off"
        >
        <small class="superuser-hint">
          <i class="fas fa-crown"></i> 
          Introduce el código secreto para registrarte como SuperUser
        </small>
      </div>
      
      <!-- Botón para mostrar/ocultar campo SuperUser -->
      <button 
        type="button" 
        class="btn-superuser-toggle" 
        id="toggle-superuser-btn"
        onclick="toggleSuperUserField()"
      >
        <i class="fas fa-user-shield"></i>
        <span>Registrar como SuperUser</span>
      </button>
      
      <button class="btn-primary" onclick="registrar()">
        <span>Crear Cuenta</span>
      </button>
      
      <div class="toggle-section">
        <span class="toggle-link" onclick="mostrarLogin()">
          ¿Ya tienes cuenta? <strong>Inicia sesión</strong>
        </span>
      </div>
    </div>

    <!-- Formulario de Login -->
    <div id="login-form" class="hidden">
      <div class="form-header">
        <h2>Bienvenido de vuelta</h2>
        <p>Accede a tu cuenta para continuar</p>
      </div>
      
      <div class="input-group">
        <input type="text" id="login-identifier" placeholder="👤 Usuario o correo" required>
      </div>
      
      <div class="input-group">
        <input type="password" id="login-password" placeholder="🔒 Contraseña" required>
      </div>
      
      <button class="btn-primary" onclick="iniciarSesion()">
        <span>Iniciar Sesión</span>
      </button>
      
      <div class="toggle-section">
        <span class="toggle-link" onclick="mostrarRegistro()">
          ¿No tienes cuenta? <strong>Regístrate</strong>
        </span>
      </div>
    </div>

    <div id="mensaje"></div>
  </div>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
