<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - SistemaTickets</title>
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <main class="main-content">
            <div class="main-header">
                <h2>Gestión de Usuarios</h2>
                <p>Administra usuarios y sus roles en el sistema</p>
            </div>

            <!-- Botón para crear nuevo usuario -->
            <div class="mb-3">
                <button class="btn btn-primary" onclick="abrirModalNuevoUsuario()">
                    <i class="fas fa-user-plus"></i>
                    Crear Nuevo Usuario
                </button>
            </div>

            <!-- Tabla de usuarios -->
            <div class="card">
                <div class="table-container">
                    <table class="tickets-table">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Fecha Registro</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuariosTableBody">
                            <tr>
                                <td colspan="5" class="loading">Cargando usuarios...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Nuevo Usuario -->
    <div id="nuevoUsuarioModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>
                    <i class="fas fa-user-plus"></i>
                    Crear Nuevo Usuario
                </h2>
                <span class="close" onclick="cerrarModalNuevoUsuario()">&times;</span>
            </div>
            
            <div class="modal-body">
                <form id="formNuevoUsuario">
                    <div class="form-group">
                        <label for="nuevoUsername">Nombre de Usuario <span class="required">*</span></label>
                        <input type="text" id="nuevoUsername" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="nuevoEmail">Correo Electrónico <span class="required">*</span></label>
                        <input type="email" id="nuevoEmail" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="nuevoPassword">Contraseña <span class="required">*</span></label>
                        <input type="password" id="nuevoPassword" required minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="nuevoRol">Rol <span class="required">*</span></label>
                        <select id="nuevoRol" required>
                            <option value="Usuario">Usuario</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-success" onclick="crearUsuario()">
                    <i class="fas fa-check"></i>
                    Crear Usuario
                </button>
                <button class="btn btn-secondary" onclick="cerrarModalNuevoUsuario()">
                    <i class="fas fa-times"></i>
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/auth-utils.js"></script>
    <script src="assets/js/sidebar-component.js"></script>
    <script src="assets/js/usuarios.js"></script>
</body>
</html>
