<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - SistemaTickets</title>
  <style>
    /* Estilos básicos del formulario de registro */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }
    .form-container {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 300px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #mensaje {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Formulario simple para capturar datos de registro -->
  <div class="form-container">
    <h2>Registro</h2>
    <input type="text" id="username" placeholder="Usuario" required>
    <input type="email" id="email" placeholder="Correo" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button onclick="registrar()">Registrarse</button>
    <div id="mensaje"></div>
  </div>

  <script>
    // Función que consume la API de backend usando fetch
    // Flujo:
    // 1) Lee los valores del formulario
    // 2) Hace POST a http://localhost:3000/register
    // 3) Envía JSON con headers adecuados
    // 4) Muestra el mensaje de la respuesta en pantalla
    async function registrar() {
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Llamada a la API del backend:
      // - method: "POST" -> creamos un recurso (usuario)
      // - headers: "Content-Type: application/json" -> avisamos que el body es JSON
      // - body: serializamos el objeto con los datos del formulario
      // IMPORTANTE: El backend debe tener CORS habilitado (ya está con app.use(cors()))
      const respuesta = await fetch("http://localhost:3000/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password })
      });

      // Parseamos la respuesta JSON del servidor y mostramos el mensaje
      // Si la API retorna 400 o 500, igualmente habrá un body JSON con "message"
      const data = await respuesta.json();
      document.getElementById("mensaje").innerText = data.message;
    }
  </script>
</body>
</html>
