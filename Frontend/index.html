<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tickets - Redirigiendo...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .links {
            margin-top: 2rem;
        }
        
        .links a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .links a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎫 Sistema de Tickets</h1>
        <div class="spinner"></div>
        <p>Redirigiendo al sistema de autenticación...</p>
        
        <div class="links">
            <a href="auth.html">🔑 Login</a>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="debug_storage.html">🛠️ Debug</a>
        </div>
        
        <div style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.8;">
            <p>👤 Usuario de prueba: <strong>testuser</strong> / <strong>123456</strong></p>
        </div>
    </div>

    <script>
        // Redirigir automáticamente después de 3 segundos
        setTimeout(() => {
            window.location.href = 'auth.html';
        }, 3000);
        
        // Permitir clic inmediato para acelerar
        document.addEventListener('click', () => {
            window.location.href = 'auth.html';
        });
    </script>
</body>
</html>
